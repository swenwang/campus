name: Prepare portfolio lockfiles
on:
  push:
    branches: [portfolio/cv-ready]
    paths: [package.json, frontend/package.json, .github/workflows/prepare-portfolio.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm install --ignore-scripts
        working-directory: frontend
      - name: Save reproducible lockfiles on the preparation branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json frontend/package-lock.json
          git diff --cached --quiet || git commit -m "build: lock portfolio toolchain dependencies"
          git push origin HEAD:portfolio/cv-ready
      - run: npm run compile
      - run: npm run typecheck
      - run: npm test
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
